name: Update Analytics Data

on:
  schedule:
    - cron: '0 3 * * *' # Si esegue ogni notte alle 03:00 UTC
  workflow_dispatch: # Ti permette di avviarlo manualmente quando vuoi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-analytics-data google-api-python-client google-auth

      - name: Fetch data from Google API
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python fetch_stats.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stats-data.json
          git commit -m "Auto update stats-data.json" || exit 0
          git push
