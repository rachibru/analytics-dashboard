<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bruno Rachiele — Analytics Map Dashboard</title>
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Leaflet per la Mappa Mondiale -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- MAPPA DI SFONDO A TUTTO SCHERMO -->
  <div id="world-map"></div>

  <!-- PANNELLO OVERLAY (Floating Sidebar & KPI) -->
  <div class="dashboard-overlay">
    
    <!-- Sidebar Sinistra con Statistiche -->
    <aside class="sidebar-panel">
      <div class="brand">
        <h1>BRUNO RACHIELE</h1>
        <div class="live-status">
          <span class="pulse-dot"></span> LIVE MONITORING
        </div>
      </div>

      <!-- Metriche KPI -->
      <div class="kpi-list">
        <div class="kpi-item">
          <span class="kpi-label">VISITE TOTALI (30gg)</span>
          <span class="kpi-value" id="total-views">---</span>
        </div>
        <div class="kpi-item">
          <span class="kpi-label">CLIC DA GOOGLE</span>
          <span class="kpi-value" id="google-clicks">---</span>
        </div>
        <div class="kpi-item">
          <span class="kpi-label">IMPRESSIONI SEARCH</span>
          <span class="kpi-value" id="google-impressions">---</span>
        </div>
        <div class="kpi-item">
          <span class="kpi-label">POSIZIONE MEDIA</span>
          <span class="kpi-value" id="avg-position">---</span>
        </div>
      </div>

      <!-- Mini Grafico Traffico -->
      <div class="panel-section">
        <h3>ANDAMENTO TRAFFICO</h3>
        <canvas id="trafficChart"></canvas>
      </div>

      <!-- Top Query Search Console -->
      <div class="panel-section scrollable">
        <h3>TOP RICERCHE GOOGLE</h3>
        <table class="mini-table">
          <thead>
            <tr><th>Query</th><th>Clic</th><th>Pos.</th></tr>
          </thead>
          <tbody id="queries-table-body">
            <!-- Popolato via JS -->
          </tbody>
        </table>
      </div>

      <!-- Top Articoli -->
      <div class="panel-section scrollable">
        <h3>ARTICOLI PIÙ LETTI</h3>
        <table class="mini-table">
          <thead>
            <tr><th>Titolo</th><th>Viste</th></tr>
          </thead>
          <tbody id="top-posts-body">
            <!-- Popolato via JS -->
          </tbody>
        </table>
      </div>

    </aside>

  </div>

  <script src="app.js"></script>
</body>
</html>
